name = "dp-katabatic-forecast-dispatcher"
main = "src/index.js"
compatibility_date = "2026-09-03"
workers_dev = true

[vars]
GITHUB_OWNER = "samqbush"
GITHUB_REPO = "dp-katabatic-research"
GITHUB_WORKFLOW = "katabatic-forecast.yml"

[triggers]
# Cloudflare cron is UTC. The Worker admits only 21:00/21:15 America/Denver,
# so these paired MDT/MST triggers follow daylight-saving changes automatically.
crons = ["0 3 * * *", "15 3 * * *", "0 4 * * *", "15 4 * * *"]

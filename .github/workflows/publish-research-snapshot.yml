# Publish the stored research snapshot to one canonical GitHub Discussion.
#
# This job only reads predictions and outcomes already persisted by the two collector workflows. It
# never calculates a call, invokes live wind meters, or changes the research model.
name: Publish katabatic research snapshot

on:
  workflow_run:
    workflows:
      - Collect night-before forecast
      - Archive weather observations and backup
    types:
      - completed
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Validate workflow dispatch without reading Neon or updating the Discussion'
        type: boolean
        default: false

permissions:
  contents: read
  discussions: write

concurrency:
  group: ${{ ((github.event_name == 'workflow_dispatch' && inputs.validate_only) || (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.display_title, 'Validate '))) && 'katabatic-discussion-publisher-validation' || 'katabatic-discussion-publisher' }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || !startsWith(github.event.workflow_run.display_title, 'Validate ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Validate workflow dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.validate_only
        run: echo "Workflow dispatch validated; research snapshot publication intentionally skipped."

      - name: Update pinned research Discussion
        if: github.event_name != 'workflow_dispatch' || !inputs.validate_only
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_RO || secrets.NEON_DATABASE_URL }}
          ECOWITT_MAC_DP_SODA_LAKES: ${{ secrets.ECOWITT_MAC_DP_SODA_LAKES }}
          ECOWITT_MAC_DP_STANDLEY_WEST: ${{ secrets.ECOWITT_MAC_DP_STANDLEY_WEST }}
          ECOWITT_MAC_DP_BOULDER_RES: ${{ secrets.ECOWITT_MAC_DP_BOULDER_RES }}
          KATABATIC_DISCUSSION_NUMBER: ${{ vars.KATABATIC_DISCUSSION_NUMBER }}
          GITHUB_TOKEN: ${{ secrets.KATABATIC_DISCUSSIONS_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm run publish:discussion

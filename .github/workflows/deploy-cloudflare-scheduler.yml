name: Deploy Cloudflare workflow scheduler

on:
  push:
    branches:
      - main
    paths:
      - cloudflare/workflow-scheduler/**
      - .github/workflows/deploy-cloudflare-scheduler.yml
  workflow_dispatch:
    inputs:
      test_dispatches:
        description: Validate all scheduler target workflows without performing their real work
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-forecast-dispatcher
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy Cloudflare workflow scheduler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/workflow-scheduler
          command: deploy
          secrets: |
            GITHUB_DISPATCH_TOKEN
        env:
          GITHUB_DISPATCH_TOKEN: ${{ secrets.KATABATIC_GITHUB_DISPATCH_TOKEN }}

      - name: Validate scheduler target dispatches
        if: github.event_name == 'workflow_dispatch' && inputs.test_dispatches
        env:
          GITHUB_DISPATCH_TOKEN: ${{ secrets.KATABATIC_GITHUB_DISPATCH_TOKEN }}
        run: |
          for workflow in \
            collect-night-before-forecast.yml \
            archive-weather-observations.yml \
            publish-research-snapshot.yml
          do
            echo "Validating $workflow"
            jq -nc '{ref:"main",inputs:{validate_only:"true"}}' |
              curl --fail-with-body \
                --request POST \
                --header "Accept: application/vnd.github+json" \
                --header "Authorization: Bearer $GITHUB_DISPATCH_TOKEN" \
                --header "Content-Type: application/json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary @- \
                "https://api.github.com/repos/samqbush/dp-katabatic-research/actions/workflows/$workflow/dispatches"
          done

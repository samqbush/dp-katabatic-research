# Nightly capture of the 00Z HRRR forecast for the next morning at Soda Lakes.
#
# Per §3 of research/katabatic-prediction.md this ships NOTHING to the phone. It only accrues
# forecast/outcome pairs, which is the one thing that cannot be bought with compute — it costs
# calendar time. The collector also materializes the versioned experimental call and chance that
# existed before the outcome; the canvas only reads those immutable rows. §14 found no rule good
# enough to act on, so these remain research evidence rather than a product recommendation.
#
# ⚠️ GitHub fires `schedule` and `workflow_dispatch` only for workflows on the DEFAULT branch.
# On a research branch this file is inert. It becomes live when the research repo is created.
name: Katabatic forecast archive

on:
  schedule:
    # 01:30 UTC = 19:30 MDT the previous evening. The 00Z run publishes ~00:50 UTC, so this is
    # ~40 min after publication, and it is also roughly when the go/no-go decision gets made.
    - cron: '30 1 * * *'
    # Recovery for delayed Open-Meteo ingestion. Existing issued predictions are a green no-op.
    # 04:00 UTC = 22:00 MDT / 21:00 MST the previous evening.
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Single morning (YYYY-MM-DD), optional'
        required: false
      from:
        description: 'Backfill start (YYYY-MM-DD), optional'
        required: false
      to:
        description: 'Backfill end (YYYY-MM-DD), optional'
        required: false

concurrency:
  group: katabatic-forecast
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Collect forecast
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_FROM: ${{ inputs.from }}
          INPUT_TO: ${{ inputs.to }}
        run: |
          if [ -n "$INPUT_DATE" ] && { [ -n "$INPUT_FROM" ] || [ -n "$INPUT_TO" ]; }; then
            echo "::error::date cannot be combined with from/to"
            exit 1
          elif { [ -n "$INPUT_FROM" ] && [ -z "$INPUT_TO" ]; } ||
               { [ -z "$INPUT_FROM" ] && [ -n "$INPUT_TO" ]; }; then
            echo "::error::from and to must be provided together"
            exit 1
          elif [ -n "$INPUT_DATE" ]; then
            node --no-warnings scripts/archive-hrrr-forecast.mjs --date "$INPUT_DATE"
          elif [ -n "$INPUT_FROM" ]; then
            node --no-warnings scripts/archive-hrrr-forecast.mjs \
              --from "$INPUT_FROM" --to "$INPUT_TO"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            node --no-warnings scripts/archive-hrrr-forecast.mjs --date "$(date -u +%F)"
          else
            node --no-warnings scripts/archive-hrrr-forecast.mjs
          fi

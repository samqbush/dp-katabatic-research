# Refresh the katabatic research archive and create a verified database backup.
#
# The forecast job records what the model PREDICTED. This one records what actually HAPPENED.
# Neither is worth anything alone — the project accrues value only as matched forecast/outcome
# pairs, one morning per day.
#
# ⚠️ This data is perishable, which is why it is scheduled rather than run by hand:
#   - Ecowitt serves 5-minute rows for ~90 days, then coarsens to 4-hour rows that cannot resolve
#     a 30-minute sustained-wind event (§4.3a).
#   - Holfuy (Lookout Mtn) publishes a rolling ~5.9-day window with NO backfill and no reachable
#     archive endpoint. A Holfuy day missed by a week is not degraded, it is GONE.
#
# The Holfuy window is what sets the daily cadence. A weekly job would already be too slow.
#
# Re-running is always safe: observations are immutable and inserted ON CONFLICT DO NOTHING, so
# days are unioned by timestamp. Resolution only ever improves and no captured minute is dropped.
# Cloudflare owns the clock schedule and invokes this workflow through workflow_dispatch.
name: Archive weather observations and backup
run-name: ${{ inputs.validate_only && 'Validate archive workflow dispatch' || 'Archive weather observations and backup' }}

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days (default 14; widen after time away)'
        required: false
        default: '14'
      validate_only:
        description: 'Validate workflow dispatch without reading or writing archive data'
        type: boolean
        default: false

concurrency:
  group: katabatic-archive
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      - name: Validate workflow dispatch
        if: inputs.validate_only
        run: echo "Workflow dispatch validated; archive refresh and backup intentionally skipped."

      - name: Refresh archive
        if: ${{ !inputs.validate_only }}
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          ECOWITT_RESEARCH_API_KEY: ${{ secrets.ECOWITT_RESEARCH_API_KEY }}
          ECOWITT_RESEARCH_APPLICATION_KEY: ${{ secrets.ECOWITT_RESEARCH_APPLICATION_KEY }}
          ECOWITT_MAC_DP_SODA_LAKES: ${{ secrets.ECOWITT_MAC_DP_SODA_LAKES }}
          ECOWITT_MAC_DP_STANDLEY_WEST: ${{ secrets.ECOWITT_MAC_DP_STANDLEY_WEST }}
          ECOWITT_MAC_DP_BOULDER_RES: ${{ secrets.ECOWITT_MAC_DP_BOULDER_RES }}
        run: node scripts/katabatic-refresh.mjs --days "${{ inputs.days || '14' }}"

      # Neon is the only live copy of data that cannot be re-fetched, so every run leaves a
      # restorable dump attached to itself. Retention is 90 days (the GitHub maximum), which makes
      # this a rolling disaster-recovery window, NOT an archive: a dump older than 90 days is
      # deleted automatically. Long-term copies still have to be pulled down deliberately.
      - name: Install PostgreSQL client
        if: ${{ !inputs.validate_only }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
        # The runner image ships an older client, and pg_dump refuses to dump from a server newer
        # than itself. backup-archive.mjs finds /usr/lib/postgresql/18/bin/pg_dump on its own and
        # hard-fails if the majors still do not line up, so a future Neon upgrade surfaces loudly
        # here rather than silently skipping backups.

      # Runs even when the refresh step failed: archive-holfuy.mjs deliberately exits non-zero
      # after a partial write, and those already-written days are exactly what needs saving.
      - name: Back up archive
        if: ${{ !cancelled() && !inputs.validate_only }}
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        # stations is dumped schema-only: its ecowitt_mac values come from the secrets above, and
        # this repo is public, so artifact downloads are unauthenticated. The rows are rebuilt by
        # scripts/db/apply-schema.mjs from scripts/lib/stations.mjs plus those secrets.
        run: |
          node scripts/backup-archive.mjs --out "$RUNNER_TEMP/archive-backup" \
            --exclude-table-data stations

      # A truncated dump looks like a backup until the day someone needs it. pg_restore --list
      # parses the archive's table of contents, so a corrupt file fails here and not in a crisis.
      # The versioned binary is deliberate: an older pg_restore rejects a newer dump, which would
      # make this step fail for a reason that has nothing to do with the dump's integrity.
      - name: Verify dump is restorable
        if: ${{ !cancelled() && !inputs.validate_only }}
        run: |
          dump=$(ls -1 "$RUNNER_TEMP/archive-backup"/*.dump | head -1)
          /usr/lib/postgresql/18/bin/pg_restore --list "$dump" > /tmp/toc.txt
          grep -q 'TABLE DATA public observations' /tmp/toc.txt \
            || { echo "::error::dump has no observations data"; exit 1; }
          if grep -q 'TABLE DATA public stations' /tmp/toc.txt; then
            echo "::error::dump contains stations rows; ecowitt_mac must not reach a public artifact"
            exit 1
          fi
          echo "✅ $(basename "$dump") restorable, observations present, stations rows excluded"

      - name: Upload dump artifact
        if: ${{ !cancelled() && !inputs.validate_only }}
        uses: actions/upload-artifact@v7
        with:
          name: dp-archive-dump-${{ github.run_id }}
          path: ${{ runner.temp }}/archive-backup/*.dump
          retention-days: 90
          if-no-files-found: error
